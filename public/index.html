
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Maker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px;
      background: #101322; color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 600px; margin: 20px auto;
      padding: 22px; background: #202640;
      border-radius: 18px;
    }
    h1 { color: #a99aff; font-size: 28px; }
    label { display:block; margin-top:18px; font-weight:bold; }
    textarea, select, input, button {
      width: 100%; padding: 14px; margin-top: 9px;
      border-radius: 10px; font-size: 16px;
    }
    textarea, select, input {
      background: #101322; color: white;
      border: 1px solid #555b78;
    }
    button {
      border: 0; background: #7965ff;
      color: white; font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #status { overflow-wrap:anywhere; line-height:1.5; }
    video, #preview { width:100%; margin-top:16px; border-radius:10px; }
    a { color:#c3baff; display:block; margin-top:12px; }
    .hint { color:#c7c9dc; font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>🎬 AI Video Maker</h1>
  <p>Матндан AI видео яратинг.</p>

  <label for="prompt">Видео ғояси</label>
  <textarea id="prompt" rows="4" maxlength="1000"
    placeholder="A lion walking through the African savanna at sunset"></textarea>

  <label for="image">Расм юклаш</label>
  <input id="image" type="file" accept="image/png,image/jpeg,image/webp">
  <p class="hint">Ҳозирги сервер фақат матнли сўровни қабул қилади. Расмдан видео ҳали уланмаган.</p>
  <img id="preview" hidden alt="Расм намунаси">

  <label for="duration">Видео давомийлиги</label>
  <select id="duration">
    <option value="5">5 сония</option>
    <option value="10">10 сония</option>
  </select>

  <button id="generate">🎥 Видео яратиш</button>
  <p id="status" role="status"></p>
  <div id="result"></div>
</main>

<script>
const button = document.getElementById("generate");
const promptInput = document.getElementById("prompt");
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");
const resultBox = document.getElementById("result");

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  preview.hidden = !file;
  if (file) preview.src = URL.createObjectURL(file);
});

button.addEventListener("click", async () => {
  const prompt = promptInput.value.trim();

  if (prompt.length < 5) {
    statusText.textContent = "Аввал камида 5 та белгидан иборат видео ғоясини ёзинг.";
    return;
  }

  if (imageInput.files.length) {
    statusText.textContent =
      "Расмдан видео функцияси серверга ҳали уланмаган. Ҳозирча расмни олиб ташлаб, матн билан синаб кўринг.";
    return;
  }

  button.disabled = true;
  resultBox.replaceChildren();
  statusText.textContent = "AI серверига сўров юборилмоқда...";

  try {
    const response = await fetch("/api/video", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        duration: Number(document.getElementById("duration").value)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Сервер хатоси: " + response.status);
    }

    if (data.status === "succeeded" && data.output) {
      let url = Array.isArray(data.output) ? data.output[0] : data.output;
      if (typeof url === "object" && url) url = url.url;

      if (typeof url === "string" && url.startsWith("https://")) {
        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.src = url;
        resultBox.appendChild(video);

        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Тайёр видеони очиш";
        resultBox.appendChild(link);
        statusText.textContent = "Видео тайёр!";
      } else {
        statusText.textContent = "Видео натижасининг ҳаволаси топилмади.";
      }
    } else if (data.id) {
      statusText.textContent =
        "Сўров қабул қилинди. Видео ID: " + data.id +
        ". Видео тайёр бўлишини автоматик текшириш учун серверга қўшимча ҳолат текшируви керак.";
    } else {
      statusText.textContent = "Сервер жавоб берди, аммо видео натижаси ҳали йўқ.";
    }
  } catch (error) {
    statusText.textContent = "Хато: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
